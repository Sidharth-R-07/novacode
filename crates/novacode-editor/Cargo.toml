[package]
name = "novacode-editor"
description = "Lightweight Zed-style terminal editor with an AI side panel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nova-edit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
novacode-base.workspace = true
futures-util.workspace = true
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ropey = "1"
walkdir = "2"
unicode-width = "0.2"
portable-pty = "0.9.0"
vt100 = "0.15"
